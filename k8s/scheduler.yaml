apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskscale-scheduler
  namespace: taskscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskscale-scheduler
  template:
    metadata:
      labels:
        app: taskscale-scheduler
    spec:
      containers:
        - name: scheduler
          image: 098474709926.dkr.ecr.eu-north-1.amazonaws.com/taskscale-scheduler:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.scheduler"]
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg2://postgres:#Shanmuk1111@postgres:5432/taskscale"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
