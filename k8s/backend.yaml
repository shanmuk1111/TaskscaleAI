apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskscale-backend
  namespace: taskscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskscale-backend
  template:
    metadata:
      labels:
        app: taskscale-backend
    spec:
      containers:
        - name: backend
          image: taskscale-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg2://postgres:#Shanmuk1111@postgres:5432/taskscale"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: taskscale
spec:
  type: NodePort
  selector:
    app: taskscale-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080